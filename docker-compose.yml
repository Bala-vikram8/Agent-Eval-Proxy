version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenteval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenteval}
      POSTGRES_DB: ${POSTGRES_DB:-agenteval}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenteval}"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build: ./proxy
    ports:
      - "${PROXY_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenteval}:${POSTGRES_PASSWORD:-agenteval}@postgres:5432/${POSTGRES_DB:-agenteval}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenteval}:${POSTGRES_PASSWORD:-agenteval}@postgres:5432/${POSTGRES_DB:-agenteval}
    depends_on:
      - postgres
    restart: unless-stopped

  eval:
    build: ./eval
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenteval}:${POSTGRES_PASSWORD:-agenteval}@postgres:5432/${POSTGRES_DB:-agenteval}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build: ./demo_agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROXY_URL: http://proxy:8000/v1
    depends_on:
      - proxy
    profiles:
      - demo

volumes:
  postgres_data:
